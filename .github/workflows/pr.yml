name: Pull request checks

# Every check a pull request has to pass, on every platform it ships to. The
# iOS build used to live in its own file because path filters apply to a
# workflow rather than to a job, and the Linux jobs were filtered while the iOS
# one deliberately was not. That reasoning ended when the filter came off — see
# below — and two files reporting on the same pull request only made it harder
# to see whether it was actually green.
#
# It runs the same verification and release build as the internal release
# pipeline, without touching Play, TestFlight or anything else. A pull request
# that passes here should be able to merge and release without surprises.
#
# The job names are load bearing. "Analyze, test and build", "Functions" and
# "Version" are configured as required status checks on `master`, which matches
# them by name, so renaming one silently stops it being required.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Superseded runs are wasted work: a new push to the same pull request makes
# the previous result irrelevant.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the rest of the workflow is allowed to skip.
  #
  # `web/downloads/` is a static site deployed to Firebase Hosting. The Flutter
  # build never reads it and no release packages it, so analyzing, testing and
  # building the app to check a change to a web page spends about nine minutes
  # proving something already known.
  #
  # This is a job rather than a `paths-ignore:` on the workflow, and the jobs
  # below still run and report with their real work skipped, because
  # "Analyze, test and build", "Functions" and "Version" are required checks on
  # `master`. A workflow filtered out by paths reports nothing at all, and a
  # required check that never reports can never be satisfied -- the pull
  # request is then blocked forever with nothing to click. The iOS workflow was
  # already bitten by exactly this and the reasoning is in the README.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The comparison is against the merge base, which a shallow clone
          # does not have.
          fetch-depth: 0

      - id: scope
        uses: ./.github/actions/changed-scope
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  verify:
    name: Analyze, test and build
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # First, because it is seconds and catches a class of mistake nothing
      # else does. A workflow file with an invalid expression is rejected by
      # GitHub before any job is scheduled: the run fails in about two seconds
      # with no logs, no runner and no indication of which line is wrong, and
      # it does that on every push regardless of the triggers the file
      # declares. The desktop release workflow shipped in exactly that state
      # and the only symptom was a red cross with nothing behind it.
      #
      # Shellcheck integration is off. It reports pre-existing style warnings
      # in both release pipelines -- unquoted expansions that are deliberate,
      # and single quotes that are meant literally -- and turning those into a
      # merge blocker is a separate decision from catching a workflow that
      # cannot run at all.
      - name: Lint the workflows
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) >/dev/null
          ./actionlint -shellcheck= -color

      - uses: ./.github/actions/setup-flutter-android
        if: needs.scope.outputs.app == 'true'

      - name: Analyze
        if: needs.scope.outputs.app == 'true'
        run: flutter analyze

      - name: Test
        if: needs.scope.outputs.app == 'true'
        run: flutter test --coverage

      # The floor is enforced here rather than only on the release workflow so
      # that a change which drops coverage is blocked before it merges, not
      # reported once it is already on master.
      - name: Coverage summary
        if: needs.scope.outputs.app == 'true'
        run: |
          # pipefail matters here: without it tee returns 0 and the coverage
          # floor below would never fail the build.
          set -o pipefail
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python tool/coverage_summary.py --min 68 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always() && needs.scope.outputs.app == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      # No signing key here: pull requests must not have access to the upload
      # key, and the branch may come from a fork. The bundle falls back to debug
      # signing, which cannot be published but still proves the release build
      # compiles, packages and resolves its native dependencies.
      - name: Build app bundle
        if: needs.scope.outputs.app == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Confirm the bundle is not release signed
        if: needs.scope.outputs.app == 'true'
        run: |
          set -euo pipefail
          if [ -f android/key.properties ] || [ -f android/app/upload-keystore.jks ]; then
            echo "Signing material must never be present on a pull request build" >&2
            exit 1
          fi

      # The job still reports, which is the point: it is a required check, and
      # a check that does not report cannot be satisfied.
      - name: Say why nothing was built
        if: needs.scope.outputs.app != 'true'
        run: |
          set -euo pipefail
          {
            echo '### Nothing the app could notice'
            echo ''
            echo 'Only `web/downloads/` changed, which is a static site served'
            echo 'by Firebase Hosting. No Flutter build reads it and no release'
            echo 'packages it, so analyze, the tests and the bundle would prove'
            echo 'something already known. The page has its own job, and its'
            echo 'own tests.'
          } >> "$GITHUB_STEP_SUMMARY"

  # The functions are deployed straight from this directory, so a syntax error
  # or a failing helper would only show up at release time otherwise. Kept as a
  # separate job because it shares nothing with the Flutter build and finishes
  # in a fraction of the time.
  functions:
    name: Functions
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Matches the "engines" field in functions/package.json, which is also
      # the runtime Cloud Functions gives the deployed code.
      - uses: actions/setup-node@v5
        if: needs.scope.outputs.app == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v5
        if: needs.scope.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        if: needs.scope.outputs.app == 'true'
        working-directory: functions
        run: npm ci

      - name: Test
        if: needs.scope.outputs.app == 'true'
        working-directory: functions
        run: npm run test:emulator

      # JavaScript has no compile step, so this stands in for one: the deployer
      # loads index.js to discover the exported functions, and anything that
      # throws on load fails the deploy after the app has already been built.
      - name: Confirm the entrypoint loads
        if: needs.scope.outputs.app == 'true'
        working-directory: functions
        run: node -e "require('./index.js')"

  # The downloads page is served exactly as it is committed -- nothing builds
  # it -- so a mistake in its script is invisible until someone opens
  # downloads.uractor.com and finds no download on it. Node's own test runner,
  # so there is nothing to install.
  downloads:
    name: Downloads site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # A glob, not the directory. Node 22 dropped the directory argument the
      # test runner used to take: it now treats its arguments as glob patterns
      # and `web/downloads/` resolves to the directory itself, which it then
      # tries to run as a test file and reports as a failure. Left unquoted so
      # the shell expands it, which also keeps the command working on the
      # older Node someone may have locally.
      - name: Test
        run: node --test web/downloads/*.test.js

  # Every merge to master ships to internal testers, so a pull request that
  # changes what the app does has to say so in the version. Otherwise two
  # different builds reach testers under the same name and a bug report cannot
  # be tied back to a revision.
  version:
    name: Version
    # There is no version bump to check outside a pull request: the check reads
    # the commits a branch adds against its merge base, and a manual run has
    # neither. Guarded rather than left to fail, so `workflow_dispatch` stays
    # useful for re-running the builds by hand.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # The check reads the commits this branch adds, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test the version tooling
        run: python -m unittest discover -s tool -p "test_*.py"

      - name: Check the version bump
        env:
          # Through the environment rather than interpolated into the script:
          # a pull request title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Compared against the merge base rather than the tip of master, so
          # the check measures what THIS branch changed. Against the tip, a
          # version bump that landed on master after this branch started would
          # read as this branch moving the version backwards.
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")

          python tool/check_version_bump.py \
            --base "$BASE" \
            --head "$HEAD_SHA" \
            --title "$PR_TITLE"

  # The iOS half of the pull request, and the reason this workflow has no
  # `paths-ignore`.
  #
  # The Linux jobs above used to be filtered to skip Markdown, docs and
  # .gitignore, while this one deliberately was not. That could not survive
  # them sharing a file, because a filter applies to a whole workflow -- and
  # keeping the filter would have been the worse half to keep anyway. GitHub
  # leaves a required check that was skipped by a path filter sitting at
  # pending forever rather than reporting success, so a documentation-only
  # pull request could never satisfy "Analyze, test and build", "Functions" and
  # "Version", all three of which are required on `master`. The filter was not
  # saving five minutes on those pull requests; it was making them unmergeable.
  #
  # The cost is the Linux jobs running on documentation-only pull requests.
  # That is about five minutes, in parallel with a macOS build that was already
  # running on them, so in wall-clock terms it is free. Runner minutes are free
  # on a public repository.
  #
  # The one exception is the `if:` below, which is a condition on the job rather
  # than a filter on the workflow. That difference is the whole point: a job
  # skipped by an `if:` still reports a conclusion, so branch protection stays
  # satisfiable, while a workflow skipped by paths reports nothing and blocks.
  ios:
    name: Build and launch on a simulator
    needs: scope
    # Skipped whole rather than run with its steps disabled, unlike the
    # required Linux jobs above, because this one holds a macOS runner:
    # starting one to skip everything on it costs a scarce minute to prove
    # nothing. A skipped job still reports, so this stays safe if the check is
    # ever made required.
    if: needs.scope.outputs.app == 'true'
    # macos-26 rather than macos-15, matching the release pipeline. The two
    # have to agree: macos-15 defaults to Xcode 16.4, and a pull request that
    # passed there could still be rejected at upload for the SDK it was built
    # with. See the `ios` stage of release-internal.yml.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-flutter-ios

      # --simulator because it needs no signing: a pull request must not have
      # access to the distribution certificate, and the branch may come from a
      # fork. It still exercises everything that actually rots — that the pods
      # resolve, that the deployment target clears what Firebase requires, and
      # that every plugin compiles against the pinned SDK.
      - name: Build for the simulator
        run: |
          flutter build ios --simulator --debug \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      # Compiling proves the code builds, not that the app can start, and the
      # iOS-specific failure that matters most — Firebase failing to configure
      # — happens at launch. Skipped without a TMDB key, because the app
      # deliberately throws at startup when the define is missing and a fork's
      # pull request has no secrets: that would report a missing secret as a
      # broken app.
      - name: Launch it on a simulator
        if: env.TMDB_API_KEY != ''
        run: |
          set -euo pipefail

          # A device created here rather than whichever ones the image happens
          # to ship, so the check does not change meaning when the image does.
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          runtimes = [
              r for r in json.load(sys.stdin)['runtimes']
              if r['isAvailable'] and 'iOS' in r['name']
          ]
          if not runtimes:
              sys.exit('no available iOS runtime on this image')

          def order(runtime):
              # Compared as numbers, not as text: sorted as strings, '9.0'
              # outranks '18.1' and the check would silently run against an
              # ancient runtime.
              parts = []
              for part in runtime['version'].split('.'):
                  parts.append(int(part) if part.isdigit() else 0)
              return parts

          print(max(runtimes, key=order)['identifier'])
          ")
          echo "using $RUNTIME"

          DEVICE=$(xcrun simctl create ios-smoke \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app

          # `simctl launch` prints "<bundle id>: <pid>" and returns as soon as
          # the process exists, so its own success says nothing about an app
          # that dies a moment later. The pid it reports is a host pid —
          # simulator apps are ordinary processes on the host — so whether the
          # app is still alive can be asked directly.
          LAUNCH=$(xcrun simctl launch "$DEVICE" com.uractor.uractorios)
          echo "$LAUNCH"
          APP_PID=${LAUNCH##*: }

          sleep 15

          # `ps -p`, not `launchctl list`. The launchd job listing is not a
          # stable interface across simulator runtimes, and reported a healthy
          # app as gone: the run that produced that verdict logged a fully
          # realised UIWindowScene, no exception and no crash report. A pid
          # either exists or it does not.
          if ps -p "$APP_PID" > /dev/null 2>&1; then
            echo "app launched (pid $APP_PID) and was still running after 15s"
          else
            echo "::error::the app did not stay running after launch (pid $APP_PID)"

            # `process == "Runner"` rather than a substring match on the
            # executable path. "Runner" is a substring of the simulator's own
            # BackgroundShortcutRunner, and matching loosely buries the app's
            # few interesting lines under thousands from a daemon that has
            # nothing to do with this build. An uncaught Dart exception in
            # main() reaches this log, which is where a missing --dart-define
            # shows up.
            echo "===== Runner system log ====="
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact \
              --predicate 'process == "Runner"' | tail -60 || true

            echo "===== crash reports ====="
            find ~/Library/Logs/DiagnosticReports -name 'Runner*' -newermt '-10 minutes' \
              -exec sh -c 'echo "--- $1 ---"; head -40 "$1"' _ {} \; 2>/dev/null || true

            exit 1
          fi

      # The release pipeline names its signing keychain `ios-signing`. This
      # asserts one never exists here: a pull request build must never hold the
      # distribution certificate, and the branch may come from a fork.
      - name: Confirm no signing material reached the build
        if: always()
        run: |
          set -euo pipefail
          if security list-keychains | grep -q ios-signing; then
            echo "A signing keychain must never exist on a pull request build" >&2
            exit 1
          fi