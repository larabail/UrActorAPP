name: Release to production

# The one pipeline that puts a build in front of real users, on all three
# platforms.
#
#   1. Android  -> Play production
#   2. iOS      -> App Store review, and a later run to release it
#   3. Desktop  -> GitHub release, then downloads.uractor.com
#
# The numbering is the order they are reported in, not the order they run in:
# all three start together once the release is approved. Serialising them would
# be worse than pointless here, because the iOS stage cannot finish in the same
# sense as the others -- Apple reviews every version by hand and answers a day
# or two later -- so nothing could sensibly wait on it.
#
# Manual only, and deliberately never triggered by a push. Android and iOS
# promote the binary testers already installed rather than rebuilding, so the
# artifact that reaches production is the one that was verified. Desktop is the
# exception and rebuilds, because its internal builds only ever existed as
# artifacts on a run and those expire; it is rebuilt from the promoted commit
# so it is at least the same source.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play version code to promote (blank = latest on internal)'
        required: false
        type: string
      commit:
        description: 'Commit that built it (blank = fall back, see workflow)'
        required: false
        type: string
      rollout:
        description: 'Android: share of users to release to'
        required: true
        default: '20%'
        type: choice
        options: ['5%', '10%', '20%', '50%', '100%']
      status:
        description: 'Android: draft = staged in Play for manual review, inProgress = live'
        required: true
        default: 'inProgress'
        type: choice
        options: ['inProgress', 'draft']
      android:
        description: 'Android: promote the build to production, or skip'
        required: true
        default: 'promote'
        type: choice
        options: ['promote', 'skip']
      ios_action:
        description: 'iOS: submit for review, release a version Apple approved, or skip'
        required: true
        default: 'submit'
        type: choice
        options: ['submit', 'release', 'skip']
      ios_build:
        description: 'iOS: build number to attach (submit only; blank = latest uploaded)'
        required: false
        type: string
      desktop:
        description: 'Desktop: publish the installers and the downloads site, or skip'
        required: true
        default: 'publish'
        type: choice
        options: ['publish', 'skip']
      version:
        description: 'Marketing version, e.g. 3.14.2 (blank = read from the promoted commit)'
        required: false
        type: string
      dry_run:
        description: 'Resolve, build and check everything, then stop before writing to any store'
        required: false
        default: false
        type: boolean

# Shared with `release-internal.yml`, so a promotion never races the upload it
# is promoting. In-progress runs finish rather than being cancelled: a
# cancelled run can leave a half-applied edit behind.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Belt and braces, and the cheap half. Required reviewers on the `production`
  # environment are the real gate and cannot be edited away in a pull request;
  # this states the intent in the file and fails before the environment is ever
  # reached. Set the RELEASE_MANAGERS repository variable to a comma-separated
  # list of logins to change who may release.
  #
  # On its own this is weak: anyone with write access could edit this file.
  # Required reviewers and branch protection on master are what make it
  # meaningful.
  authorize:
    name: Check who started this
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actor is a release manager
        env:
          MANAGERS: ${{ vars.RELEASE_MANAGERS || 'larabail' }}
        run: |
          if echo "$MANAGERS" | tr ',' '\n' | tr -d ' ' | grep -qx "$GITHUB_ACTOR"; then
            echo "$GITHUB_ACTOR is authorised to release."
          else
            echo "::error::$GITHUB_ACTOR is not a release manager. Allowed: $MANAGERS"
            exit 1
          fi

  # Resolved once for the whole run. Three stages working out for themselves
  # which commit and which version this release is would be three chances to
  # disagree, and the disagreement would only be visible afterwards, in an
  # installer and a store listing that named different versions.
  #
  # Ahead of the approval gate rather than behind it, because everything here
  # only reads: it works out what would be released so that the approver, and
  # the pre-flight below, are told which version that is. Nothing downstream of
  # the gate can begin until it has been passed.
  resolve:
    name: Resolve the release
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.version.outputs.name }}
      notes: ${{ steps.notes.outputs.text }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Internal builds are not tagged: tags mark production releases only. The
      # internal run's summary prints the commit it built, and that commit is
      # passed in here. Builds made before that change still have their build-*
      # tag, so those are honoured too and historic promotions stay traceable.
      - name: Resolve the commit that produced the build
        id: source
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then
            REF=$(git rev-parse -q --verify "$COMMIT^{commit}") || {
              echo "::error::commit '$COMMIT' is not in this repository"
              exit 1
            }
          elif [ -n "$VERSION_CODE" ] && git rev-parse -q --verify "build-$VERSION_CODE^{commit}" >/dev/null; then
            REF=$(git rev-parse "build-$VERSION_CODE^{commit}")
          else
            REF=$(git rev-parse HEAD)
            echo "::warning::No commit was given and there is no build tag for version code '${VERSION_CODE:-latest}', so HEAD ($REF) is assumed. Release notes and the release tag may cover commits the promoted artifact does not contain."
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "promoting the build produced by $REF"

      # Read from the promoted commit rather than from HEAD. Promoting a build
      # from a fortnight ago while master has since moved to 3.17.0 would
      # otherwise publish a desktop installer and an App Store version named
      # after a release the promoted binary is not.
      - name: Resolve the version name
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            NAME="${REQUESTED#v}"
          else
            NAME=$(git show "$REF:pubspec.yaml" | sed -n 's/^version: *\([0-9][^+]*\).*/\1/p')
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$NAME' is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME"

      # Production notes cover everything since the last production release,
      # not since the last internal build, so a user who skipped several test
      # builds still sees what changed for them. The range ends at the commit
      # that produced the promoted build rather than at HEAD, so notes never
      # describe commits that are not in the artifact being shipped.
      - name: Generate release notes
        id: notes
        env:
          END: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p build
          LAST=$(git tag --list 'released-*' --sort=-v:refname | head -n1)
          echo "notes range: ${LAST:-full history}..$END"
          python tool/release_notes.py --since "$LAST" --until "$END" \
            --output build/release_notes.json
          TEXT=$(python tool/release_notes.py --since "$LAST" --until "$END" --stdout)
          if [ -z "$TEXT" ]; then
            TEXT="Bug fixes and improvements."
          fi
          {
            echo "text<<RELEASE_NOTES_EOF"
            echo "$TEXT"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Carried to the Android stage rather than regenerated there, so the
      # store listing and the GitHub release cannot describe the same release
      # differently.
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: build/release_notes.json
          retention-days: 30

  # The cheapest failure in the pipeline, moved to where it is cheap. Apple
  # refuses to edit a version once it is in review, and refuses to create one
  # while a different version holds its single editable slot -- both in about
  # four seconds, and both from facts that are true before anybody clicks
  # approve.
  #
  # Behind the gate, as this used to be, those four seconds arrived last: after
  # a reviewer had approved the release and after Play and the desktop stage
  # had already written to their stores. The run then ended red having shipped
  # two platforms out of three, for a reason that was knowable at the start.
  #
  # Read only, and it stays that way -- the version record is created in the
  # iOS stage below, after the gate, so that nothing is written to any store
  # until the release has been approved. This only decides whether it could be.
  #
  # No job-level `if`. A skipped job skips everything that needs it, which would
  # take the approval gate and the whole release with it whenever iOS was left
  # out. The steps opt out instead, and the job still reports green.
  preflight:
    name: Check Apple will accept this
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      VERSION: ${{ needs.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        if: inputs.ios_action != 'skip'

      - uses: actions/setup-python@v6
        if: inputs.ios_action != 'skip'
        with:
          python-version: '3.12'

      - name: Install the App Store Connect client
        if: inputs.ios_action != 'skip'
        run: pip install --quiet "pyjwt[crypto]" requests

      - name: Check the version exists and is ours to change
        if: inputs.ios_action != 'skip'
        env:
          ACTION: ${{ inputs.ios_action }}
          REQUESTED_BUILD: ${{ inputs.ios_build }}
        run: |
          set -uo pipefail
          if python tool/appstore.py check \
               --version "$VERSION" \
               --action "$ACTION" \
               --build "$REQUESTED_BUILD"; then
            echo "App Store pre-flight passed for $VERSION."
            exit 0
          fi
          {
            echo "### App Store pre-flight failed"
            echo ""
            cat <<EOF
          Nothing has been released, and nothing will be: \`$VERSION\` cannot be
          the subject of a \`$ACTION\` as things stand, so the run stopped rather
          than ask anyone to approve a release that cannot happen.

          A version already with Apple has to be withdrawn deliberately, and a
          different version holding Apple's single editable slot has to be
          finished or renamed. Neither is something to do unattended. Then
          start this run again.
          EOF
            echo ""
            echo '```'
            python tool/appstore.py status || echo '(could not read state)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Note that iOS was skipped
        if: inputs.ios_action == 'skip'
        run: echo "ios_action is 'skip', so there is nothing to check with Apple."

  # One approval for the whole release, rather than one per platform. This job
  # does nothing except hold the `production` environment: every stage below
  # waits on it, so approving here approves the release on all three platforms
  # at once.
  #
  # The alternative -- putting `environment: production` on each stage -- would
  # record a deployment per store, which is genuinely nicer to read afterwards,
  # but it asks for the approval once per job. Three clicks to answer one
  # question is how people learn to click through approvals without reading
  # them, which is the opposite of what the gate is for.
  #
  # It waits on `resolve` and `preflight` so the question put to a human is the
  # real one. An approver should be told the version being shipped rather than
  # the blank box the form was submitted with, and should not be asked to
  # approve a release that already cannot happen.
  approve:
    name: Wait for release approval
    needs: [resolve, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production
      url: https://play.google.com/store/apps/details?id=com.uractor.uractorapp

    steps:
      - name: Note what is being released
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          echo "Version: $VERSION"
          echo "Commit: $REF"
          echo "Play version code: ${VERSION_CODE:-latest on internal}"
          echo "Android: ${{ inputs.android }} at ${{ inputs.rollout }} (${{ inputs.status }})"
          echo "iOS: ${{ inputs.ios_action }}"
          echo "Desktop: ${{ inputs.desktop }}"
          echo "Dry run: ${{ inputs.dry_run }}"

  # ---------------------------------------------------------------- 1. Android

  # Every stage can be skipped independently, and that is load bearing rather
  # than a convenience. An App Store release is two runs of this pipeline --
  # `submit`, then `release` a day or two later once Apple approves -- and on
  # that second run Android and desktop must be told to stay out of it.
  # Otherwise the second run promotes whatever internal builds landed during
  # Apple's review straight to Play production, and publishes a desktop release
  # built from a `master` nobody asked to ship.
  android:
    name: '1 · Android → Play production'
    needs: [approve, resolve]
    if: inputs.android == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tagging the production release is the only write this pipeline makes to
    # the repository outside the desktop stage.
    permissions:
      contents: write

    outputs:
      code: ${{ steps.promote.outputs.version-code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Play API client
        run: pip install --quiet google-auth requests

      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: build

      - name: Promote
        id: promote
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
          ROLLOUT: ${{ inputs.rollout }}
          STATUS: ${{ inputs.status }}
        run: |
          FRACTION=$(echo "$ROLLOUT" | tr -d '%' | awk '{print $1 / 100}')
          ARGS=(promote --source internal --target production
                --status "$STATUS" --rollout "$FRACTION"
                --notes build/release_notes.json)
          if [ -n "$VERSION_CODE" ]; then
            ARGS+=(--version-code "$VERSION_CODE")
          fi
          python tool/play.py "${ARGS[@]}"

      # `tool/play.py` has no dry run of its own -- every path it takes opens a
      # real Play edit -- so a dry run stops short of calling it and says what
      # it would have called it with. Less thorough than the App Store dry run
      # below, and honest about it rather than pretending otherwise.
      - name: What the promotion would have done
        if: ${{ inputs.dry_run }}
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          echo "dry run: would promote ${VERSION_CODE:-the latest internal build}"
          echo "from internal to production at ${{ inputs.rollout }}, status ${{ inputs.status }}."
          echo "Release notes that would be sent:"
          cat build/release_notes.json

      # Marks where production reached, so the next promotion's notes start
      # from here rather than repeating changes users have already seen. The
      # desktop stage's `v<version>` release tag is a different thing: it names
      # a version people download, while this names a point in the history.
      - name: Tag the production release
        if: ${{ !inputs.dry_run }}
        env:
          TARGET: ${{ needs.resolve.outputs.ref }}
          CODE: ${{ steps.promote.outputs.version-code }}
        run: |
          set -euo pipefail
          TAG="released-$CODE"
          git tag -f "$TAG" "$TARGET"
          git push -f origin "$TAG"
          echo "tagged $TAG at $TARGET"

  # -------------------------------------------------------------------- 2. iOS

  # Apple reviews every version by hand, so there is no equivalent of Play's
  # promote-and-it-is-live. A release is two runs of this pipeline: `submit`
  # now, then `release` once Apple has approved. Nothing here compiles anything
  # -- it is all App Store Connect API calls -- so it finishes in a couple of
  # minutes.
  ios:
    name: '2 · iOS → App Store'
    needs: [approve, resolve]
    if: inputs.ios_action != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      VERSION: ${{ needs.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the App Store Connect client
        run: pip install --quiet "pyjwt[crypto]" requests

      - name: Show what Apple currently holds
        run: |
          set -euo pipefail
          {
            echo '### App Store versions before this run'
            echo ''
            echo '```'
            python tool/appstore.py status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only for a submission, and only when the caller did not name one. The
      # latest build is the one TestFlight has just received, which is the one
      # a release normally means.
      - name: Resolve the build to attach
        id: build
        if: inputs.ios_action == 'submit'
        env:
          REQUESTED: ${{ inputs.ios_build }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            BUILD="$REQUESTED"
          else
            # next-build reports the number the next upload would take, so the
            # newest build Apple actually holds is one below it.
            NEXT=$(python tool/appstore.py next-build)
            BUILD=$((NEXT - 1))
            echo "no build given; using the latest Apple holds: $BUILD"
          fi
          echo "number=$BUILD" >> "$GITHUB_OUTPUT"

      # The step that used to be a person in App Store Connect. It is safe to
      # automate for a reason that was measured rather than assumed: a version
      # created through the API arrives already holding the previous version's
      # description, keywords, support URL and every screenshot set, exactly as
      # it does when created in the web UI. `whatsNew` is the only field that
      # comes back empty, and it is the only one that should differ per
      # release -- so it is filled from the same notes Play gets, generated
      # once in `resolve` and carried here rather than regenerated.
      #
      # After the approval gate, deliberately. A version record is invisible to
      # users, but it is also not deletable once any build exists for the
      # platform, so creating one is not a thing to do speculatively before
      # someone has said the release is going ahead.
      - name: Make sure the version record exists
        if: inputs.ios_action == 'submit'
        env:
          NOTES: ${{ needs.resolve.outputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > /tmp/whats_new.txt
          echo "release notes ($(wc -c < /tmp/whats_new.txt) bytes):"
          cat /tmp/whats_new.txt
          python tool/appstore.py ensure-version \
            --version "$VERSION" \
            --whats-new-file /tmp/whats_new.txt \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Set to MANUAL release inside the tool, so approval leaves the version
      # waiting rather than putting it in front of users. Releasing is the
      # separate run below, which is the point of splitting the two.
      - name: Submit for review
        if: inputs.ios_action == 'submit'
        run: |
          python tool/appstore.py submit \
            --version "$VERSION" \
            --build "${{ steps.build.outputs.number }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Release to the App Store
        if: inputs.ios_action == 'release'
        run: |
          python tool/appstore.py release \
            --version "$VERSION" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record what happened
        if: always()
        run: |
          set -uo pipefail
          {
            echo '### App Store after this run'
            echo ''
            echo "- action: \`${{ inputs.ios_action }}\`"
            echo "- version: \`$VERSION\`"
            if [ "${{ inputs.ios_action }}" = "submit" ]; then
              echo "- build: \`${{ steps.build.outputs.number }}\`"
            fi
            echo "- dry run: \`${{ inputs.dry_run }}\`"
            echo ''
            echo '```'
            python tool/appstore.py status || echo '(could not read state)'
            echo '```'
            echo ''
            if [ "${{ inputs.ios_action }}" = "submit" ]; then
              echo 'Apple reviews this on its own schedule, usually a day or two.'
              echo 'It was submitted for **manual** release, so approval leaves it'
              echo 'at PENDING_DEVELOPER_RELEASE rather than going live. Run this'
              echo 'pipeline again with `ios_action: release` when you want users'
              echo 'to have it — and set `android: skip` and `desktop: skip` on'
              echo 'that run, or it will promote whatever has landed on `master`'
              echo 'in the meantime to Play production and publish a desktop'
              echo 'release nobody asked for.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 3. Desktop

  # The one stage that builds rather than promotes. Play and Apple both hold
  # the tested binary and can move it between tracks; nothing holds a desktop
  # build except the internal run that made it, and those artifacts expire. So
  # this rebuilds -- from the promoted commit, not from HEAD, so it is at least
  # the same source that testers ran.
  #
  # Two build jobs because macOS and Windows cannot be cross compiled, and a
  # third to publish, because nothing should be published until both installers
  # exist. A GitHub release carrying only one of them is worse than none: the
  # downloads page would offer a link that 404s for half its visitors.

  desktop_macos:
    name: '3 · Desktop → build macOS'
    needs: [approve, resolve]
    if: inputs.desktop == 'publish'
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      VERSION: ${{ needs.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Import the Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          # Set here rather than in the job's `env:`. The `runner` context does
          # not exist until a step is running, so referring to runner.temp in a
          # job-level `env:` is rejected when the file is parsed -- which fails
          # the whole workflow before any job is scheduled, with no logs to
          # debug from.
          KEYCHAIN="$RUNNER_TEMP/desktop-release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without a timeout the keychain relocks partway through a long
          # build and codesign fails in the middle of it.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign finds the key and then blocks on a GUI
          # prompt no one is there to answer, and the job hangs until timeout
          # rather than failing.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Added to the search list rather than replacing it: dropping the
          # login keychain takes Apple's intermediates with it and the
          # signature then fails to chain.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"$/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in the keychain." >&2
            echo "An 'Apple Development' certificate cannot sign a build for" >&2
            echo "distribution outside the App Store. See docs/releases.md." >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as '$IDENTITY'"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Developer ID distribution normally needs no provisioning profile.
          # This app needs one because it declares `keychain-access-groups`,
          # which is a restricted entitlement: Firebase Auth keeps the signed
          # in session in the macOS data protection keychain, and macOS
          # refuses that to an app which has not been granted a keychain
          # group. Without the profile the build fails outright; with the
          # entitlement stripped instead the app builds, signs and launches
          # and then refuses every correct password, which is the worse
          # failure because it looks like the app working.
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"

          # Xcode locates a profile by its UUID as the filename, not by the
          # name inside it, so the UUID is read back out rather than assumed.
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" \
            | plutil -extract UUID raw -o - -)

          # Installed to both directories, for the same reason the iOS stage
          # does it: Xcode 16 reads profiles from its own directory and older
          # tooling still reads the MobileDevice one, and which applies is a
          # detail of the image rather than something to depend on.
          for dir in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.provisionprofile" "$dir/$UUID.provisionprofile"
          done

          rm -f "$RUNNER_TEMP/profile.provisionprofile"
          echo "installed provisioning profile $UUID"

      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build macos --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Sign with the hardened runtime
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/UrActor.app"

          # Notarisation refuses anything without the hardened runtime, and
          # every nested framework has to be signed before the bundle that
          # contains them -- signing outside-in leaves the inner ones unsigned
          # and the staple fails much later with a vaguer error.
          find "$APP/Contents/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null \
            | while read -r item; do
                codesign --force --timestamp --options runtime \
                  --sign "$SIGNING_IDENTITY" "$item"
              done || true

          codesign --force --deep --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Package as a DMG
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/UrActor.app"
          DMG="UrActor-${VERSION}-macos.dmg"

          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          # The Applications symlink is what makes the window a drag target
          # rather than a folder someone has to work out what to do with.
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "UrActor" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"

          # The DMG is signed too. Notarisation staples the ticket to the
          # container, and an unsigned container cannot carry one.
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarise and staple
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # The same App Store Connect key TestFlight uses. An app-specific
          # password would also work and is what most guides show, but it
          # breaks whenever the Apple ID's password or 2FA changes, which is
          # exactly the sort of failure that surfaces months later during a
          # release nobody has time to debug.
          KEY_PATH="$RUNNER_TEMP/asc.p8"
          printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"

          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait \
            --timeout 45m

          rm -f "$KEY_PATH"

          # Stapling puts the ticket inside the DMG, so the first launch works
          # on a machine with no network. Without it Gatekeeper has to ask
          # Apple, and an offline user is blocked.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # What a user's machine will actually conclude.
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG"

      - name: Checksum
        run: shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-macos
          path: |
            UrActor-*.dmg
            UrActor-*.dmg.sha256
          if-no-files-found: error

      - name: Remove the signing material
        if: always()
        run: |
          # Unconditional: a failed build leaves the same key material behind
          # as a successful one.
          #
          # The path is recomputed rather than read from the environment, so
          # this still works if the import step died before it managed to
          # export KEYCHAIN -- which is exactly the run that would otherwise
          # leave a keychain full of private key behind on the runner.
          security delete-keychain "$RUNNER_TEMP/desktop-release.keychain-db" \
            2>/dev/null || true

          # The profile goes too, matching what the iOS stage does. It carries
          # no private key, but everything a secret wrote to this runner is
          # removed on the way out rather than sometimes.
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.provisionprofile
          rm -f "$RUNNER_TEMP/profile.provisionprofile"

  desktop_windows:
    name: '3 · Desktop → build Windows'
    needs: [approve, resolve]
    if: inputs.desktop == 'publish'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      VERSION: ${{ needs.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Build
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build windows --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      # Inno Setup rather than MSIX. MSIX can auto-update through App Installer,
      # but it cannot be sideloaded without a code signing certificate at all --
      # so while this build is unsigned, MSIX would be undeliverable rather than
      # merely warned about.
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            windows\installer\uractor.iss

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/windows/installer
          sha256sum UrActor-*-windows-setup.exe | tee UrActor-"$VERSION"-windows-setup.exe.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-windows
          path: |
            build/windows/installer/UrActor-*-windows-setup.exe
            build/windows/installer/*.sha256
          if-no-files-found: error

  desktop_publish:
    name: '3 · Desktop → publish'
    needs: [approve, resolve, desktop_macos, desktop_windows]
    if: inputs.desktop == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Creating the release and its `v<version>` tag.
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: artifacts

      - name: Collect the assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.sha256' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: What would have been published
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo '### Desktop dry run'
            echo ''
            echo "Both installers built for \`$VERSION\`. Nothing was published:"
            echo 'no GitHub release, no tag, and `downloads.uractor.com` is'
            echo 'unchanged. The files are attached to this run.'
            echo ''
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The installers go to GitHub releases rather than to Firebase Hosting.
      # Firebase bills for bandwidth past its free tier and these files are
      # over a hundred megabytes each, so a modest month of downloads would
      # start costing money; GitHub serves release assets over a CDN for free.
      #
      # `target_commitish` is stated rather than left to default, because the
      # tag has to land on the promoted commit and GITHUB_SHA is whatever
      # master happened to be when the run started.
      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ needs.resolve.outputs.ref }}
          name: UrActor ${{ env.VERSION }}
          body: |
            ${{ needs.resolve.outputs.notes }}

            ## Downloads

            https://downloads.uractor.com

            The Windows installer is not yet code signed, so Windows will show
            "Windows protected your PC" the first time it runs. Choose
            **More info** then **Run anyway**. Checksums are attached.
          files: dist/*
          fail_on_unmatched_files: true

      # Through the environment, not interpolated into the script. The notes
      # are built from commit subjects, which are text somebody else wrote, and
      # a subject containing a backtick or a `$(` would otherwise be run by the
      # shell on a runner holding the deploy credentials.
      #
      # The page itself is not built here. It is committed as it is served and
      # reads the releases API in the browser, so this writes only the
      # manifest: the file the app polls, and the page's fallback for when
      # that API is rate limited.
      - name: Write the update manifest
        if: ${{ !inputs.dry_run }}
        env:
          NOTES: ${{ needs.resolve.outputs.notes }}
        run: |
          set -euo pipefail
          python tool/build_download_manifest.py \
            --version "$VERSION" \
            --notes "$NOTES"

      # Deployed last, and only once the release and its assets exist. The
      # manifest is what tells every running copy that a new version is out,
      # so publishing it before the files are downloadable would send people
      # to a 404.
      - name: Deploy downloads.uractor.com
        if: ${{ !inputs.dry_run }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: actordb-cf981
          channelId: live

  # ------------------------------------------------------------------ epilogue

  # The stages run in parallel and can fail independently, and one of them --
  # iOS -- succeeds by handing the release to Apple rather than by finishing
  # it. Without this, "did that release go out?" is answered by reading five
  # job results and knowing which of them were meant to run.
  summary:
    name: Report what was released
    needs: [resolve, android, ios, desktop_macos, desktop_windows, desktop_publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Write the summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          REF: ${{ needs.resolve.outputs.ref }}
          CODE: ${{ needs.android.outputs.code }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          DESKTOP_MACOS: ${{ needs.desktop_macos.result }}
          DESKTOP_WINDOWS: ${{ needs.desktop_windows.result }}
          DESKTOP_PUBLISH: ${{ needs.desktop_publish.result }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          mark() {
            case "$1" in
              success)   echo ':white_check_mark: done' ;;
              skipped)   echo ':heavy_minus_sign: skipped' ;;
              cancelled) echo ':black_circle: cancelled' ;;
              *)         echo ':x: failed' ;;
            esac
          }

          # `desktop_publish` alone is not enough to report the desktop stage
          # with. It is `skipped` both when the release deliberately left
          # desktop out and when one of the two builds failed underneath it,
          # and those are opposite things to tell someone reading this.
          DESKTOP="$DESKTOP_PUBLISH"
          for result in "$DESKTOP_MACOS" "$DESKTOP_WINDOWS"; do
            case "$result" in
              success|skipped) ;;
              *) DESKTOP="$result" ;;
            esac
          done

          {
            echo "### Production — $VERSION"
            echo ''
            if [ "$DRY_RUN" = "true" ]; then
              echo '> **Dry run.** Nothing was written to any store.'
              echo ''
            fi
            echo '| # | Platform | Result | Detail |'
            echo '|---|---|---|---|'
            echo "| 1 | Android · Play | $(mark "$ANDROID") | ${CODE:-—} at ${{ inputs.rollout }}, ${{ inputs.status }} |"
            echo "| 2 | iOS · App Store | $(mark "$IOS") | \`${{ inputs.ios_action }}\` |"
            echo "| 3 | Desktop | $(mark "$DESKTOP") | \`v$VERSION\` and downloads.uractor.com |"
            echo ''
            echo "Promoted from commit \`$REF\`."
            echo ''
            echo 'Widen or halt the Android rollout from the Play Console; a'
            echo 'halted rollout stops new users receiving the update but does'
            echo 'not remove it from anyone who already has it. There is no'
            echo 'equivalent for desktop: what is published is downloadable.'
          } >> "$GITHUB_STEP_SUMMARY"
