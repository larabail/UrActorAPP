name: Release desktop

# Builds the macOS and Windows apps, publishes them to a GitHub release, and
# updates downloads.uractor.com so existing installs learn there is a new
# version.
#
# Deliberately NOT triggered by merges to master, unlike the mobile releases.
# The macOS half takes around twenty-five minutes against roughly five on
# Linux, because most of it is spent compiling gRPC and Firestore from source,
# and it would run on every merge for a build nobody had asked to publish.
# More to the point, desktop has no equivalent of a store's staged rollout:
# whatever is published here is what people download, immediately, with no way
# to hold it back once it is out. Both say a release should be a deliberate
# act, so this runs on a tag.
#
#     git tag v3.16.0 && git push origin v3.16.0
#
# The tag is the source of truth for the version. It must match the `version:`
# name in pubspec.yaml, and the preflight job below refuses the run if it does
# not -- a release whose installer, download page and in-app update notice
# disagree about what it is would be worse than no release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 3.16.0)'
        required: true

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Runs on Linux in seconds, and exists so the slow jobs are never started
  # for a release that cannot finish. Without it, a missing secret or a
  # mistyped tag is discovered twenty macOS minutes later and looks like a
  # broken release rather than an unfinished setup.
  preflight:
    name: Check the release is configured
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are read from the commit history since the previous
          # tag, which a shallow clone does not have.
          fetch-depth: 0

      - name: Resolve the version and check it matches pubspec
        id: resolve
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$VERSION' is not MAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          # The name half only. The +build suffix belongs to Play and has
          # nothing to say about a desktop build.
          PUBSPEC=$(sed -n 's/^version: *\([0-9][^+]*\).*/\1/p' pubspec.yaml)
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "Tag says $VERSION, pubspec.yaml says $PUBSPEC." >&2
            echo "Bump pubspec.yaml and retag, or the installer, the download" >&2
            echo "page and the update notice will disagree." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Check the macOS signing secrets are present
        env:
          CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CERT CERT_PASSWORD KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret for $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "" >&2
            echo "See docs/releases.md, 'Releasing the desktop apps'." >&2
            echo "The three APP_STORE_CONNECT_* secrets are the same ones" >&2
            echo "TestFlight already uses; notarisation reuses them." >&2
            exit 1
          fi

      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          # Same generator the store listings use, so a desktop release is
          # described in the same words as the mobile one.
          NOTES=$(python tool/release_notes.py --stdout 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Bug fixes and improvements."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Build, sign and notarise macOS
    needs: preflight
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Import the Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          # Set here rather than in the job's `env:`. The `runner` context does
          # not exist until a step is running, so referring to runner.temp in
          # a job-level `env:` is rejected when the file is parsed -- which
          # fails the whole workflow before any job is scheduled, with no logs
          # to debug from. (Written without the expression braces on purpose:
          # they would be expanded here too, since a run script is templated
          # before it reaches the shell.)
          #
          # $RUNNER_TEMP is an ordinary variable inside a script and is the
          # same directory. It is outside the workspace, so the keychain cannot
          # be swept up by an artifact upload.
          KEYCHAIN="$RUNNER_TEMP/desktop-release.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without a timeout the keychain relocks partway through a long
          # build and codesign fails in the middle of it.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign finds the key and then blocks on a GUI
          # prompt no one is there to answer, and the job hangs until timeout
          # rather than failing.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Added to the search list rather than replacing it: dropping the
          # login keychain takes Apple's intermediates with it and the
          # signature then fails to chain.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"$/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in the keychain." >&2
            echo "An 'Apple Development' certificate cannot sign a build for" >&2
            echo "distribution outside the App Store. See docs/releases.md." >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as '$IDENTITY'"

      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build macos --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Sign with the hardened runtime
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/UrActor.app"

          # Notarisation refuses anything without the hardened runtime, and
          # every nested framework has to be signed before the bundle that
          # contains them -- signing outside-in leaves the inner ones unsigned
          # and the staple fails much later with a vaguer error.
          find "$APP/Contents/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null \
            | while read -r item; do
                codesign --force --timestamp --options runtime \
                  --sign "$SIGNING_IDENTITY" "$item"
              done || true

          codesign --force --deep --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGNING_IDENTITY" "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Package as a DMG
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/UrActor.app"
          DMG="UrActor-${VERSION}-macos.dmg"

          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          # The Applications symlink is what makes the window a drag target
          # rather than a folder someone has to work out what to do with.
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "UrActor" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"

          # The DMG is signed too. Notarisation staples the ticket to the
          # container, and an unsigned container cannot carry one.
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarise and staple
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # The same App Store Connect key TestFlight uses. An app-specific
          # password would also work and is what most guides show, but it
          # breaks whenever the Apple ID's password or 2FA changes, which is
          # exactly the sort of failure that surfaces months later during a
          # release nobody has time to debug.
          KEY_PATH="$RUNNER_TEMP/asc.p8"
          printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"

          xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait \
            --timeout 45m

          rm -f "$KEY_PATH"

          # Stapling puts the ticket inside the DMG, so the first launch works
          # on a machine with no network. Without it Gatekeeper has to ask
          # Apple, and an offline user is blocked.
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # What a user's machine will actually conclude.
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG"

      - name: Checksum
        run: shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            UrActor-*.dmg
            UrActor-*.dmg.sha256
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: |
          # Unconditional: a failed build leaves the same key material behind
          # as a successful one.
          #
          # The path is recomputed rather than read from the environment, so
          # this still works if the import step died before it managed to
          # export KEYCHAIN -- which is exactly the run that would otherwise
          # leave a keychain full of private key behind on the runner.
          security delete-keychain "$RUNNER_TEMP/desktop-release.keychain-db" \
            2>/dev/null || true

  windows:
    name: Build Windows
    needs: preflight
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build windows --release \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      # Inno Setup rather than MSIX. MSIX can auto-update through App Installer,
      # but it cannot be sideloaded without a code signing certificate at all --
      # so while this build is unsigned, MSIX would be undeliverable rather than
      # merely warned about.
      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            windows\installer\uractor.iss

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/windows/installer
          sha256sum UrActor-*-windows-setup.exe | tee UrActor-"$VERSION"-windows-setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/windows/installer/UrActor-*-windows-setup.exe
            build/windows/installer/*.sha256
          if-no-files-found: error

  publish:
    name: Publish the release and the downloads site
    needs: [preflight, macos, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.sha256' \) \
            -exec cp {} dist/ \;
          ls -la dist

      # The installers go to GitHub releases rather than to Firebase Hosting.
      # Firebase bills for bandwidth past its free tier and these files are
      # over a hundred megabytes each, so a modest month of downloads would
      # start costing money; GitHub serves release assets over a CDN for free.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: UrActor ${{ env.VERSION }}
          body: |
            ${{ needs.preflight.outputs.notes }}

            ## Downloads

            https://downloads.uractor.com

            The Windows installer is not yet code signed, so Windows will show
            "Windows protected your PC" the first time it runs. Choose
            **More info** then **Run anyway**. Checksums are attached.
          files: dist/*
          fail_on_unmatched_files: true

      - name: Build the downloads site
        run: |
          set -euo pipefail
          python tool/build_downloads_site.py \
            --version "$VERSION" \
            --notes "${{ needs.preflight.outputs.notes }}"

      # Deployed last, and only once the release and its assets exist. The
      # manifest is what tells every running copy that a new version is out,
      # so publishing it before the files are downloadable would send people
      # to a 404.
      - name: Deploy downloads.uractor.com
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: actordb-cf981
          channelId: live
