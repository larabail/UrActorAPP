name: Release to TestFlight

# The iOS counterpart to release-internal.yml. Same shape: every merge to
# master goes to internal testers, production is somebody's deliberate
# decision elsewhere.
#
# One difference worth knowing before you enable it. This job spends most of its
# time compiling gRPC and Firestore from source, so a release here takes 20-30
# minutes against about five for the Android half. It costs no money -- standard
# runners are free on a public repository -- but it is the slowest thing in the
# release path. If that wait is not worth it on every merge, delete the `push`
# trigger and run it by hand: nothing else in the workflow depends on how it was
# started.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# Two runs would ask Apple for the same build number and the second upload
# would be rejected after it had already spent twenty minutes building. Runs
# already in flight are allowed to finish, because a cancelled one can leave a
# build half-processed on Apple's side.
concurrency:
  group: testflight-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs on Linux, costs nothing, and exists so that the expensive job is never
  # started for a repository that cannot finish it. Without this, every merge to
  # master would spend twenty minutes of macOS time before failing on a missing
  # secret, and the failure would look like a broken release rather than an
  # unfinished setup.
  preflight:
    name: Check the release is configured
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Look for the App Store secrets
        id: check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$KEY_ID" ]        || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ISSUER_ID" ]     || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$PRIVATE_KEY" ]   || missing+=(APP_STORE_CONNECT_PRIVATE_KEY)
          [ -n "$CERT" ]          || missing+=(IOS_DIST_CERT_P12_BASE64)
          [ -n "$CERT_PASSWORD" ] || missing+=(IOS_DIST_CERT_PASSWORD)
          [ -n "$PROFILE" ]       || missing+=(IOS_PROVISIONING_PROFILE_BASE64)

          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo '### iOS release skipped'
            echo ''
            echo 'The TestFlight workflow is present but not yet configured.'
            echo 'Missing repository secrets:'
            echo ''
            for name in "${missing[@]}"; do echo "- \`$name\`"; done
            echo ''
            echo 'See `docs/releases.md`, under "Releasing to TestFlight", for'
            echo 'how to create each of them.'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and upload to TestFlight
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    # macos-26, not macos-15. Apple refuses any upload built against an SDK
    # older than iOS 26, and macos-15 defaults to Xcode 16.4, which carries the
    # iOS 18.5 SDK. That rejection arrives from App Store Connect as a 409
    # after the archive has already been built and uploaded, so the runner
    # image is what decides whether a release is possible at all.
    runs-on: macos-26
    timeout-minutes: 90

    env:
      BUNDLE_ID: com.uractor.uractorios
      TEAM_ID: Q8XY8276AC
      # Named so the pull request check can assert it never exists there.
      KEYCHAIN: ios-signing.keychain-db

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter-ios

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the App Store Connect client
        run: pip install --quiet "pyjwt[crypto]" requests

      # Checked before anything expensive happens. Apple refuses an upload
      # built against an SDK older than iOS 26, and it refuses it at the very
      # end — a 409 from App Store Connect after the archive is built and
      # sent, roughly fifteen minutes in. Reading the SDK off the selected
      # Xcode turns that into a failure in the first few seconds, with a
      # message that says which Xcode was chosen.
      #
      # Apple raises this floor roughly once a year, a few months after each
      # iOS release. When it moves, raise MINIMUM_IOS_SDK and, if the image
      # default is behind, select a newer Xcode from /Applications.
      - name: Check the iOS SDK is new enough to upload
        env:
          MINIMUM_IOS_SDK: 26
        run: |
          set -euo pipefail

          echo "Xcode: $(xcodebuild -version | head -1) at $(xcode-select -p)"
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"

          if [ "${SDK%%.*}" -lt "$MINIMUM_IOS_SDK" ]; then
            echo "::error::Built against the iOS $SDK SDK, but App Store Connect requires iOS $MINIMUM_IOS_SDK or later. Available Xcodes: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

      # A failing build must not reach testers, exactly as on the Android side.
      # These are platform independent and already ran on Linux for the pull
      # request, but a merge can combine two branches that were each green
      # alone, and this is the last point before something reaches a device.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Everything from here holds signing material, so every step that writes
      # a secret to disk has a matching removal in the cleanup step at the end,
      # which runs even when the build fails.
      - name: Import the signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          # Random, and never leaves the run: this keychain lives for one job.
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without a timeout the keychain relocks partway through a long
          # archive and codesign fails somewhere in the middle of it.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign finds the key and then blocks on a GUI
          # prompt that no one is there to answer, and the job hangs until it
          # times out rather than failing.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Added to the search list rather than replacing it: dropping the
          # login keychain takes the Apple intermediate certificates with it,
          # and the signature then fails to chain.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN"

          # Read back rather than assumed. A certificate issued before 2019 is
          # named "iPhone Distribution" and a current one "Apple Distribution",
          # and naming the wrong one fails the archive with an identity-not-
          # found error that says nothing about which name was expected.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)"$/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "the imported certificate has no code signing identity" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as '$IDENTITY'"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Xcode 16 reads profiles from its own directory; older tooling still
          # reads the MobileDevice one. Installed to both, because which one is
          # consulted is a detail of the Xcode on the image rather than
          # something this workflow should depend on.
          for dir in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/"
          done

          # The export step has to name the profile, and the name is inside the
          # profile rather than something the workflow gets to choose.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "using provisioning profile '$PROFILE_NAME'"

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool takes a key id, not a path, and looks for the file itself in
          # a fixed set of directories. This is one of them.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      # Asked of Apple rather than read from pubspec.yaml, for the same reason
      # the Android side asks Play: a build number that has ever been uploaded
      # is burned forever, so the committed suffix drifts and collides. Note
      # that the `+BUILD` suffix in pubspec.yaml is Play's number and is not
      # written back to from here — the two stores count separately, and one
      # overwriting the other's record would make both meaningless.
      - name: Determine the version and next build number
        id: version
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          APP_ID=$(python tool/appstore.py app-id)
          BUILD=$(python tool/appstore.py next-build --app-id "$APP_ID")
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)

          {
            echo "app-id=$APP_ID"
            echo "build=$BUILD"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Building $NAME ($BUILD) for app $APP_ID"

      - name: Write the export options
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      # `ExportOptions.plist` governs only the export half of `flutter build
      # ipa`. The archive before it uses the project's own settings, and the
      # Runner target sets no CODE_SIGN_STYLE at all, so Xcode falls back to
      # Automatic — which resolves profiles by asking the developer portal
      # through an Apple account signed into Xcode. A hosted runner has no
      # such account, so the archive fails before the export options are ever
      # consulted. The project also pins CODE_SIGN_IDENTITY to "iPhone
      # Developer", which no distribution certificate matches.
      #
      # Written into the xcconfig at build time rather than committed, because
      # automatic signing is the right default for someone building locally in
      # Xcode. The target's Release configuration uses this file as its base
      # configuration, which outranks the project-level settings it has to
      # override.
      - name: Force manual signing for the archive
        run: |
          set -euo pipefail
          cat >> ios/Flutter/Release.xcconfig <<XCCONFIG

          // Appended by the TestFlight workflow. Never committed.
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = ${SIGNING_IDENTITY}
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = ${SIGNING_IDENTITY}
          XCCONFIG

          tail -7 ios/Flutter/Release.xcconfig

      - name: Build the IPA
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          flutter build ipa --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.build }}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      # altool rather than the App Store Connect API: the API has no endpoint
      # that accepts a binary. `--upload-package` rather than `--upload-app`,
      # which Xcode 16 marks deprecated; the newer form wants the identifiers
      # stated rather than read back out of the archive.
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          # Options before the path predicate: BSD find (which is what macOS
          # has) does not accept -maxdepth after -name.
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "no .ipa was produced" >&2
            exit 1
          fi
          echo "uploading $IPA"

          xcrun altool --upload-package "$IPA" \
            --type ios \
            --apple-id "${{ steps.version.outputs.app-id }}" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "${{ steps.version.outputs.build }}" \
            --bundle-short-version-string "${{ steps.version.outputs.name }}" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Record what was built
        run: |
          {
            echo '### Uploaded to TestFlight'
            echo ''
            echo "- version: ${{ steps.version.outputs.name }}"
            echo "- build number: ${{ steps.version.outputs.build }}"
            echo "- commit: $GITHUB_SHA"
            echo ''
            echo 'Apple still has to finish processing the build before it'
            echo 'reaches testers, which it does on its own schedule.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the IPA for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.version.outputs.build }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # Unconditional: a failed build leaves the same private key and the same
      # certificate on the runner as a successful one.
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          # Also covered here rather than only inline after the import, because
          # a wrong certificate password fails that step before its own `rm`.
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
