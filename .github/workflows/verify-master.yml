name: Verify master

# The checks a merge to master owes even when it ships nothing.
#
# `release-internal.yml` runs `flutter analyze` and `flutter test` before it
# builds, and that run earns its keep independently of the build: a merge commit
# is a combination neither branch tested on its own, so it is the first moment
# two independently green branches can be shown to disagree. Nothing else on
# master looks at it -- `pr.yml` runs on pull requests only.
#
# That coupling is what kept `test/**` out of the release filter, and the cost
# came due: build 95 was built, signed, uploaded to every internal tester and
# then lost its tag to a race, entirely because a Dart test file changed. A
# build identical to the one before it, under a version name already used --
# which is the ambiguity the version policy exists to prevent.
#
# Splitting the two lets the filter cover `test/**` without giving up the
# verification. This workflow is deliberately the cheap half: Linux, no signing
# material, no store credentials, no artifact. It cannot release anything.
on:
  push:
    branches: [master]

# Not the `release` group. This publishes nothing, and queueing it behind a
# half-hour build would delay the only signal a skipped merge produces.
concurrency:
  group: verify-master-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          # Deep enough to diff against whatever master was before this push.
          fetch-depth: 0

      # Whether the release workflow is already doing this. Asked of the same
      # `paths-ignore` block GitHub itself consulted, through
      # `tool/release_paths.py`, so the two cannot answer differently and decide
      # between them that nobody needs to run the tests.
      - name: Decide whether these checks are owed
        id: owed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A first push reports the all-zero sha and a forced update can leave
          # a commit that is no longer here. Neither can be diffed, and the
          # cheap direction is to run the checks rather than skip a merge
          # commit nothing has looked at.
          if [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'verify=true' >> "$GITHUB_OUTPUT"
            echo 'No usable previous commit to compare against; verifying.'
            exit 0
          fi

          git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed.txt
          echo 'Changed files:'
          sed 's/^/  /' changed.txt

          VERIFY=$(python3 tool/needs_master_verify.py < changed.txt)
          echo "verify=$VERIFY" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-flutter-android
        if: steps.owed.outputs.verify == 'true'

      - name: Analyze
        if: steps.owed.outputs.verify == 'true'
        run: flutter analyze

      - name: Test
        if: steps.owed.outputs.verify == 'true'
        run: flutter test

      # The Python tools are not covered by the release workflow at all -- only
      # `pr.yml` runs them -- so a merge that changes one of them has had its
      # tests run against the branch and never against the merge commit. They
      # cost seconds and need no Flutter, so they run whenever this job does.
      - uses: actions/setup-python@v6
        if: steps.owed.outputs.verify == 'true'
        with:
          python-version: '3.12'

      - name: Test the repository tooling
        if: steps.owed.outputs.verify == 'true'
        run: python -m unittest discover -s tool -p "test_*.py"

      - name: Say what happened
        run: |
          set -euo pipefail
          if [ '${{ steps.owed.outputs.verify }}' = 'true' ]; then
            echo '### Master verified' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'This push ships no build, so `release-internal.yml` did not' >> "$GITHUB_STEP_SUMMARY"
            echo 'run. `flutter analyze`, `flutter test` and the tool tests ran' >> "$GITHUB_STEP_SUMMARY"
            echo 'here against the merge commit instead.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Nothing to do' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'This push ships a build, so `release-internal.yml` is running' >> "$GITHUB_STEP_SUMMARY"
            echo 'analyze and test against this commit already.' >> "$GITHUB_STEP_SUMMARY"
          fi
