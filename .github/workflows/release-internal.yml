name: Release to internal testing

# Every merge to master ships to internal testers. Production is a separate,
# manual workflow, so nothing here can reach real users.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# Two runs uploading at once would pick the same version code and the second
# would be rejected, so releases are serialised. In-progress runs are allowed
# to finish rather than being cancelled, because a cancelled run can leave an
# uploaded-but-unassigned version code behind.
concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deployed before the app is uploaded, and the upload is blocked if this
  # fails. The order matters: a build that reaches testers expecting a callable
  # that is not deployed yet fails on the device, so the server side goes first.
  functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        working-directory: functions
        run: npm ci

      # The same gate the pull request ran. Repeated here because a merge
      # commit is a combination neither branch tested on its own.
      - name: Test
        working-directory: functions
        run: npm test

      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set." >&2
            echo "Create a service account with the Firebase Admin and Cloud" >&2
            echo "Functions Admin roles, and store its JSON key as that" >&2
            echo "repository secret. Failing rather than skipping: a silent" >&2
            echo "skip ships an app whose server side does not exist." >&2
            exit 1
          fi

          # Written to the runner's temp directory rather than the workspace,
          # so it cannot be picked up by a later step or an artifact upload.
          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS"

          npx --yes firebase-tools@15 deploy \
            --only functions \
            --project actordb-cf981 \
            --non-interactive \
            --force

      # Runs even when the deploy fails, so a failed run never leaves a key
      # behind on the runner.
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  release:
    name: Build and upload to internal
    needs: functions
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are derived from the commits since the previous build
          # tag, which needs full history and tags rather than a shallow clone.
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter-android

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Play API client
        run: pip install --quiet google-auth requests

      # A failing build must not reach testers, so verification gates the upload.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      # Coverage is only useful if something reads it. The floor covers the
      # tested layers rather than the whole project, because most of lib/ is
      # widget code with no widget tests and a project-wide number would have
      # to be set too low to catch anything.
      - name: Coverage summary
        run: |
          # pipefail matters here: without it tee returns 0 and the coverage
          # floor below would never fail the build.
          set -o pipefail
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python tool/coverage_summary.py --min 68 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: ignore

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Derived from Play rather than pubspec.yaml: Play refuses a version code
      # that was ever uploaded, including to an abandoned edit, so the committed
      # build number drifts out of date and collides.
      - name: Determine next version code
        id: version
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          CODE=$(python tool/play.py next-code)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($CODE)"

      - name: Build app bundle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Generate release notes
        run: |
          mkdir -p build
          python tool/release_notes.py --output build/release_notes.json
          echo '### Release notes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python tool/release_notes.py --stdout >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to internal testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python tool/play.py upload \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track internal \
            --status completed \
            --release-name "${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes build/release_notes.json

      # Tags belong to production releases only, so nothing is tagged here.
      # Promotion still needs to know which commit produced a version code, so
      # the mapping is recorded in the run summary and passed to the production
      # workflow by hand.
      - name: Record what was built
        run: |
          {
            echo '### Built'
            echo ''
            echo "- version: ${{ steps.version.outputs.name }}"
            echo "- version code: ${{ steps.version.outputs.code }}"
            echo "- commit: $GITHUB_SHA"
            echo ''
            echo "To promote this build, run the production workflow with"
            echo "version code \`${{ steps.version.outputs.code }}\` and commit"
            echo "\`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
